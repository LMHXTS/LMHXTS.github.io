site_name: LMHXTS Blog
site_description: "Sich selber übervoll, sich selber bethauen, sich selber Regenguss sein einer verschmachtenden Wildniss."

theme:
  name: material
  language: zh
  # 自定义 CSS（用于微调样式）
  custom_dir: docs/assets/overrides
  # 图标与字体配置
  icon:
    repo: fontawesome/brands/github
    logo: fontawesome/solid/book-open
  font:
    text: Inter, Noto Sans SC
    code: JetBrains Mono, Fira Code
  # 主题色彩与深浅色切换配置
  palette:
    # 方案 1：深色模式（默认）
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式

    # 方案 2：浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
  features:
    # 导航
    - navigation.tabs           # 顶部 Tab 导航
    - navigation.top            # 返回顶部按钮
    - navigation.instant        # 瞬时加载（SPA 体验）
    - navigation.tracking       # 地址栏跟随滚动标题
    - navigation.path           # 面包屑导航
    # 目录
    - toc.follow                # 目录跟随滚动
    - toc.integrate             # 目录集成在左侧
    # 搜索
    - search.highlight          # 搜索结果高亮
    - search.share              # 可分享搜索结果链接
    - search.suggest            # 搜索建议
    # 内容
    - content.code.copy         # 代码块复制按钮
    - content.code.annotate     # 代码注释
    - content.tabs.link         # 标签页链接
    # 社交
    - navigation.footer         # 页脚导航  



# 核心：配置顶部 Tab 和左侧导航栏
nav:
  - HOME: index.md
  - 机器学习:
      - 贝叶斯学习: ml/Bayes.md
      - 决策树: ml/Decision_tree.md
      - K-近邻: ml/K-NN.md
      - CART: ml/Cart.md
      - XGBoost数学推导: ml/Xgboost_math.md
      - 逻辑回归: ml/Logistic_Regression.md
  - 深度学习:
      - BP Neural Network: dl/BPNN.md
      - Optimization & Generalization: dl/Optimization.md
  - 电动力学:
      - 第一章：电磁现象的普遍规律: electrodynamics/talkemd_2.md
  - ABOUT: about.md


markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - blog